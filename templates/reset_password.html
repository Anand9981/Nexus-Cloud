{% extends "base.html" %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center p-4 relative">
    
    <!-- Toast Notification Container Node -->
    <div id="toast-notification-node" class="fixed top-6 right-6 z-[999] hidden p-4 rounded-2xl shadow-xl transition-all duration-300 transform translate-y-[-20px] flex items-center gap-3 font-black text-xs uppercase tracking-wide max-w-sm">
        <span id="toast-icon"></span>
        <p id="toast-message" class="leading-none"></p>
    </div>

    <div class="bg-white dark:bg-[#1E293B] p-8 rounded-[2.5rem] border border-slate-100 dark:border-slate-800 shadow-xl w-full max-w-md space-y-6 relative overflow-hidden">
        
        <!-- Header Panel Branding Description -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-rose-50 dark:bg-rose-950/40 rounded-2xl flex items-center justify-center text-2xl mx-auto shadow-sm">🔑</div>
            <h2 class="text-xl font-black text-slate-900 dark:text-white uppercase tracking-tight">Recover Account</h2>
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-wide">Verify credentials to bypass or rewrite parameters safely.</p>
        </div>

        <form id="recovery-master-form" class="space-y-4">
            <!-- Username Input Group -->
            <div class="space-y-1">
                <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block ml-1">Username</label>
                <input type="text" id="reset-username" required placeholder="Enter username..."
                       class="w-full p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-900 text-xs font-bold border-none outline-none focus:ring-1 focus:ring-nexus text-slate-800 dark:text-slate-100">
            </div>

            <!-- Registered Email Input Group -->
            <div class="space-y-1">
                <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block ml-1">Registered Email</label>
                <input type="email" id="reset-email" required placeholder="name@example.com"
                       class="w-full p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-900 text-xs font-bold border-none outline-none focus:ring-1 focus:ring-nexus text-slate-800 dark:text-slate-100">
            </div>

            <!-- Action Dispatch Buttons Matrix -->
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button type="button" onclick="triggerEmailOTPSend()" class="bg-nexus/10 hover:bg-nexus/20 text-nexus py-3 rounded-xl font-black text-[10px] uppercase tracking-wider transition-all">
                    📩 Send Email OTP
                </button>
                <button type="button" onclick="displaySecretFallbackField()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-600 dark:text-slate-300 py-3 rounded-xl font-black text-[10px] uppercase tracking-wider transition-all">
                    🔒 Use Security Secret
                </button>
            </div>

            <!-- Dynamic OTP Verification Input Context Container -->
            <div id="otp-verification-wrapper" class="space-y-1 hidden animate-fadeIn">
                <label class="text-[9px] font-black text-emerald-600 uppercase tracking-widest block ml-1">Verification OTP Token</label>
                <input type="text" id="input-otp-token" placeholder="Enter 6-digit dynamic key..."
                       class="w-full p-3.5 rounded-2xl bg-emerald-50/50 dark:bg-slate-900 border border-emerald-100 dark:border-emerald-900/40 text-xs font-bold outline-none focus:ring-1 focus:ring-emerald-500 text-slate-800 dark:text-slate-100">
            </div>

            <!-- Combined Recovery Question & Secret Answer Dropdown Cluster -->
            <div id="secret-verification-wrapper" class="space-y-4 hidden animate-fadeIn">
                <div class="space-y-1 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block ml-1">Verification Question Match</label>
                    <select id="reset-question"
                            class="w-full p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-900 text-xs font-bold border-none outline-none focus:ring-1 focus:ring-nexus text-slate-700 dark:text-slate-300">
                        <option value="" disabled selected>Select matching signup verification question...</option>
                        <option value="What was the name of your first school?">What was the name of your first school?</option>
                        <option value="What is your favorite high-protein food item?">What is your favorite high-protein food item?</option>
                        <option value="What is the name of your childhood hometown?">What is the name of your childhood hometown?</option>
                        <option value="What was the model of your first vehicle/scooter?">What was the model of your first vehicle/scooter?</option>
                        <option value="What is your favorite programming language name?">What is your favorite programming language name?</option>
                    </select>
                </div>

                <div class="space-y-1" id="answer-input-container-box">
                    <label class="text-[9px] font-black text-rose-500 uppercase tracking-widest block ml-1">Your Signup Security Secret Answer</label>
                    <div class="relative flex items-center transition-all duration-300 rounded-2xl" id="input-shaker-wrapper">
                        <input type="password" id="reset-security-answer" placeholder="Enter secret keyword..."
                               class="w-full p-3.5 pr-12 rounded-2xl bg-rose-50/40 dark:bg-slate-900 border border-rose-100/60 dark:border-rose-900/40 text-xs font-bold outline-none focus:ring-1 focus:ring-rose-500 text-slate-800 dark:text-slate-100 transition-all">
                        <button type="button" onclick="toggleFieldVisibility('reset-security-answer', this)" class="absolute right-4 text-xs grayscale select-none cursor-pointer focus:outline-none z-10">👁️</button>
                    </div>
                </div>
            </div>

            <!-- Target Encryption Control Settings Area -->
            <div class="space-y-1 pt-2 border-t border-slate-100 dark:border-slate-800">
                <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block ml-1">New Secure Password</label>
                <div class="relative flex items-center">
                    <input type="password" id="reset-new-password" required placeholder="••••••••"
                           class="w-full p-3.5 pr-12 rounded-2xl bg-slate-50 dark:bg-slate-900 text-xs font-bold border-none outline-none focus:ring-1 focus:ring-nexus text-slate-800 dark:text-slate-100">
                    <button type="button" onclick="toggleFieldVisibility('reset-new-password', this)" class="absolute right-4 text-xs grayscale select-none cursor-pointer focus:outline-none z-10">👁️</button>
                </div>
            </div>

            <!-- Form Dispatch Action Submitter Button -->
            <button type="submit" class="w-full bg-slate-900 dark:bg-nexus text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg shadow-blue-500/10 hover:scale-[1.02] transition-transform block pt-3">
                Update & Sign In
            </button>
        </form>
    </div>
</div>

<script>
    let activeVerificationMode = null; // Can hold 'OTP' or 'SECRET'

    // Visibility toggle controller block mask handler
    function toggleFieldVisibility(fieldId, element) {
        const inputField = document.getElementById(fieldId);
        if (inputField && inputField.type === "password") {
            inputField.type = "text";
            element.style.opacity = "0.5";
        } else if (inputField) {
            inputField.type = "password";
            element.style.opacity = "1";
        }
    }

    // Custom Toast Alert System
    function triggerToastAlert(type, message) {
        const container = document.getElementById('toast-notification-node');
        const iconSpan = document.getElementById('toast-icon');
        const msgPara = document.getElementById('toast-message');
        
        msgPara.innerText = message;
        container.className = "fixed top-6 right-6 z-[999] p-4 rounded-2xl shadow-xl transition-all duration-300 transform flex items-center gap-3 font-black text-xs uppercase tracking-wide max-w-sm";
        
        if (type === 'success') {
            container.classList.add('bg-emerald-500', 'text-white');
            iconSpan.innerText = "✅";
        } else if (type === 'error') {
            container.classList.add('bg-rose-500', 'text-white');
            iconSpan.innerText = "❌";
        } else {
            container.classList.add('bg-amber-500', 'text-white');
            iconSpan.innerText = "⚠️";
        }
        
        container.classList.remove('hidden');
        setTimeout(() => { container.classList.add('translate-y-0'); }, 10);
        
        setTimeout(() => {
            container.classList.add('translate-y-[-20px]', 'opacity-0');
            setTimeout(() => { 
                container.classList.add('hidden'); 
                container.classList.remove('opacity-0'); 
            }, 300);
        }, 4000);
    }

    function triggerEmailOTPSend() {
        const username = document.getElementById('reset-username').value;
        const email = document.getElementById('reset-email').value;
        
        if(!username || !email) {
            triggerToastAlert('warning', 'Please input Username and Registered Email before transmitting OTP parameters.');
            return;
        }

        fetch('/send-recovery-otp', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: username, email: email })
        })
        .then(res => {
            if (res.status === 404) {
                res.text().then(htmlContent => { document.documentElement.innerHTML = htmlContent; });
                return null;
            }
            return res.json();
        })
        .then(data => {
            if (!data) return;
            if(data.status === 'success') {
                triggerToastAlert('success', 'Dynamic 6-digit verification security token broadcasted to your mailbox.');
                document.getElementById('otp-verification-wrapper').classList.remove('hidden');
                document.getElementById('secret-verification-wrapper').classList.add('hidden');
                
                document.getElementById('reset-question').required = false;
                document.getElementById('reset-security-answer').required = false;
                document.getElementById('input-otp-token').required = true;
                activeVerificationMode = 'OTP';
            } else {
                triggerToastAlert('error', 'Account verification failed: ' + data.message);
            }
        });
    }

    function displaySecretFallbackField() {
        document.getElementById('secret-verification-wrapper').classList.remove('hidden');
        document.getElementById('otp-verification-wrapper').classList.add('hidden');
        
        document.getElementById('input-otp-token').required = false;
        document.getElementById('reset-question').required = true;
        document.getElementById('reset-security-answer').required = true;
        activeVerificationMode = 'SECRET';
    }

    // Intercept Form Submission Pipeline with your custom fetch logic block
    document.getElementById('recovery-master-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        if(!activeVerificationMode) {
            triggerToastAlert('warning', 'Security critical validation error. Please authorize identity via Email OTP or Security Secret first.');
            return;
        }

        const answerInput = document.getElementById('reset-security-answer');
        const shakerWrapper = document.getElementById('input-shaker-wrapper');
        
        // Clear any previous error visual indicators states
        answerInput.classList.remove('border-rose-500', 'bg-rose-50', 'dark:bg-rose-950/20');
        shakerWrapper.classList.remove('animate-shake');

        const payload = {
            username: document.getElementById('reset-username').value,
            email: document.getElementById('reset-email').value,
            new_password: document.getElementById('reset-new-password').value,
            mode: activeVerificationMode,
            otp_token: document.getElementById('input-otp-token').value,
            security_question: document.getElementById('reset-question').value,
            security_answer: answerInput.value
        };

        // Your exact requested Fetch Engine Block
        fetch('/execute-secure-reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => {
            // Identity Profile missing handles (404)
            if (response.status === 404) {
                response.text().then(htmlContent => {
                    document.documentElement.innerHTML = htmlContent;
                });
                return null;
            }
            // Agar status ok (200) ya wrong answer (401) hai toh json pass hoga
            return response.json();
        })
        .then(data => {
            if (!data) return;

            if (data.status === 'success') {
                // SUCCESS: Green Pop-up and transfer
                triggerToastAlert('success', 'Password Changed Successfully');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2500);
            } else {
                // FAILURE: Wrong Answer logic (Red Glow + Shaking Animation)
                triggerToastAlert('error', data.message || 'Verification Rejected');
                
                // Target text fields variables element indicators
                answerInput.classList.add('border-rose-500', 'bg-rose-50', 'dark:bg-rose-950/20');
                shakerWrapper.classList.add('animate-shake');
            }
        })
        .catch(err => {
            triggerToastAlert('error', 'Critical operational database synchronization dropout.');
        });
    });
</script>

<style>
/* Pure CSS shake keyframes inject mapping to handle incorrect answer indicators */
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
}
.animate-shake { animation: shake 0.4s ease-in-out; }
</style>
{% endblock %}
