{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto py-10 px-4">
    
    <div class="mb-10 flex flex-col items-center justify-center">
        <div class="flex items-center gap-4">
            <h1 class="text-3xl font-black text-slate-900 dark:text-white uppercase tracking-tight">{{ folder.folder_name }}</h1>
            
            <a href="/share/download-all/{{ folder.share_token }}" class="bg-blue-400 text-white px-4 py-2 rounded-xl text-[8px] font-black uppercase tracking-wider shadow-md hover:bg-blue-300 hover:scale-105 transition-all flex items-center gap-1.5 cursor-pointer">
                📥
            </a>
        </div>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-2">Shared Cloud Folder</p>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
        {% for img in images %}
        <div class="bg-white dark:bg-[#1E293B] rounded-xl overflow-hidden border border-slate-100 dark:border-slate-800 shadow-sm group hover:shadow-md transition-all">
            
            <div class="aspect-square overflow-hidden bg-slate-100 dark:bg-slate-900 relative">
                <img src="{{ img.thumb_url if img.thumb_url else img.url }}" onerror="this.src='{{ img.url }}'" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300 cursor-pointer" onclick="openImageLightbox('{{ img.url }}', '{{ img._id }}')">
            </div>
            
            <div class="p-1 bg-white dark:bg-[#1E293B]">
                <div class="grid grid-cols-3 gap-px bg-slate-100 dark:bg-slate-900 py-0.7 px-0.5 rounded-md border border-slate-200 dark:border-slate-800 text-center shadow-inner">
                    <div class="flex flex-col items-center justify-center cursor-pointer group/like" onclick="likePhoto('{{ img._id }}')">
                        <span class="text-[10px] filter drop-shadow-sm group-hover/like:scale-110 transition-transform">❤️</span>
                        <span id="likes-{{ img._id }}" class="text-[8px] font-black text-slate-700 dark:text-slate-300 leading-none mt-1">{{ img.likes or 0 }}</span>
                    </div>
                    <div class="flex flex-col items-center justify-center cursor-pointer group/view" onclick="openImageLightbox('{{ img.url }}', '{{ img._id }}')">
                        <span class="text-[10px] filter drop-shadow-sm group-hover/view:scale-110 transition-transform">👁️</span>
                        <span id="views-{{ img._id }}" class="text-[8px] font-black text-slate-700 dark:text-slate-300 leading-none mt-1">{{ img.views or 0 }}</span>
                    </div>
                    <a href="/download-image/{{ img._id }}" class="flex flex-col items-center justify-center group/down decoration-none block">
                        <span class="text-[10px] filter drop-shadow-sm group-hover/down:scale-110 transition-transform">📥</span>
                        <span id="downloads-{{ img._id }}" class="text-[8px] font-black text-slate-700 dark:text-slate-300 leading-none mt-1">{{ img.downloads or 0 }}</span>
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    
    {% if not images %}
    <div class="py-20 text-center">
        <p class="text-sm font-bold text-slate-400">No assets found in this folder.</p>
    </div>
    {% endif %}
</div>

<div id="lightbox-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-[999] flex items-center justify-center p-4 animate-fadeIn" onclick="closeImageLightbox()">
    <div class="relative max-w-4xl max-h-[85vh] flex items-center justify-center" onclick="event.stopPropagation()">
        <button onclick="closeImageLightbox()" class="absolute -top-12 right-0 text-white bg-white/10 hover:bg-white/20 w-10 h-10 rounded-full font-black text-sm transition-all">✕</button>
        <img id="lightbox-image-target" src="" class="max-w-full max-h-[85vh] rounded-2xl object-contain shadow-2xl border border-white/10">
    </div>
</div>

<script>
    function likePhoto(id) {
        fetch('/like-image/' + id, { method: 'POST' })
        .then(r => r.json())
        .then(d => {
            if(d.status === 'success') {
                const likeCount = document.getElementById('likes-' + id);
                likeCount.innerText = d.new_likes;
                likeCount.previousElementSibling.animate([
                    { transform: 'scale(1)' }, { transform: 'scale(1.4)' }, { transform: 'scale(1)' }
                ], { duration: 300 });
            }
        });
    }

    function openImageLightbox(imageUrl, imgId) {
        document.getElementById('lightbox-image-target').src = imageUrl;
        document.getElementById('lightbox-modal').classList.remove('hidden');
        
        fetch(`/increment-view/${imgId}`, { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                const viewElement = document.getElementById(`views-${imgId}`);
                if(viewElement) viewElement.innerText = data.new_views;
            }
        }).catch(err => console.log(err));
    }

    function closeImageLightbox() {
        document.getElementById('lightbox-modal').classList.add('hidden');
        document.getElementById('lightbox-image-target').src = "";
    }
</script>
{% endblock %}
