<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unauthorized Entry - Nexus</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #0c121e;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-[#0e1726] w-full max-w-[440px] p-8 rounded-3xl border border-slate-200/5 shadow-[0_30px_70px_rgba(0,0,0,0.6)] text-center space-y-6 animate-fadeIn">
        
        <div class="relative flex justify-center">
            <div class="w-20 h-20 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-3xl shadow-[0_0_30px_rgba(244,63,94,0.15)] animate-pulse">
                🔒
            </div>
            <div class="absolute bottom-0 right-[155px] w-6 h-6 bg-rose-600 rounded-md flex items-center justify-center text-[10px] shadow-md border border-rose-500/20">🚨</div>
        </div>
        
        <div class="space-y-2">
            <h1 class="text-xl font-black text-slate-100 uppercase tracking-tight font-sans">ACCESS UNAUTHORIZED</h1>
            <p class="text-slate-400 text-[11px] font-medium uppercase tracking-wide leading-relaxed max-w-xs mx-auto">
                Requested profile ID is invalid. Please verify your identity name and try again.
            </p>
        </div>

        <div class="h-[1px] w-full bg-slate-800/60"></div>

        <div class="pt-1">
            <a href="/login" class="w-full inline-flex justify-center items-center gap-2 bg-blue-600 text-white py-3 rounded-xl font-black text-[10px] uppercase tracking-wider shadow-md shadow-blue-500/10 hover:bg-blue-500 active:scale-95 transition-all duration-200 cursor-pointer">
                ➔ Try Logging In Again
            </a>
        </div>
    </div>

</body>
</html>
