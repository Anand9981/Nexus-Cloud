{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#1E293B] p-10 rounded-[2.5rem] shadow-2xl border border-slate-100 dark:border-slate-800 w-full max-w-sm text-center space-y-6">
        <div class="text-4xl">🔒</div>
        <div class="space-y-2">
            <h2 class="text-lg font-black text-slate-800 dark:text-white uppercase tracking-widest">Protected Folder</h2>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">This folder is locked. Enter password to view assets.</p>
        </div>

        {% if error %}
        <p class="text-[10px] font-black text-rose-500 uppercase">{{ error }}</p>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div class="relative">
                <input type="password" id="access-password" name="password" placeholder="Enter Secret Password" required 
                    class="w-full p-4 pr-12 rounded-xl bg-slate-50 dark:bg-slate-900 border-none outline-none focus:ring-2 focus:ring-nexus font-bold text-xs">
                
                <button type="button" onclick="const p = document.getElementById('access-password'); p.type = p.type === 'password' ? 'text' : 'password';" 
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 font-bold text-[10px]">
                    👁️
                </button>
            </div>
            
            <button type="submit" class="w-full bg-nexus text-white py-4 rounded-xl font-black text-xs uppercase tracking-wider hover:scale-[1.02] transition-transform">
                Access Folder ➔
            </button>
        </form>
    </div>
</div>
{% endblock %}
